name: Release

# Publishing follows the version declared in `package.json`. The main-branch
# caller runs the full certification matrix first and then invokes this workflow:
# when `v<version>` has no tag yet, this run certifies every exact Core ref, packs
# the archive, creates the annotated tag on that verified revision, and publishes
# the Release. A version that is already tagged publishes nothing, so merges that
# do not bump the version stay release-free. The tag is created with
# `GITHUB_TOKEN`, which by design does not start another workflow run.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dsh-playwright-host-release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Decide whether the declared version is still unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "declared version: $version"
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag $tag already exists; this run publishes nothing"
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            if ! gh release view "$tag" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
              echo "::error::tag $tag exists without a published Release; preserve the immutable tag and review interrupted publication before recovery"
              exit 1
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag $tag is unreleased; this run publishes it"
          fi

  release:
    name: release
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          path: dsh-core-rc1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d347e703908d0406b7a7ef80e3a0e594d86b2215
          path: dsh-core-alpha1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 5dda764ed3aa172535a7967b06ff95d9cbfe536a
          path: dsh-core-015-alpha1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b2e3b2a0125854567a4a5fcba75782e42fe84901
          path: dsh-core-015-alpha2
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 183f08e9c6dde7e36cd2318eaee70b0da08fb35e
          path: dsh-core-015-rc1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: fb2c4b9e698e30edb738bca4cf0618587db7d203
          path: dsh-core-015-rc2
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 0a15e36e7f82b6ed45af6fa9759f29b40dcd965d
          path: dsh-core-016-alpha1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ddefc45fbc7f8e46dd73185e68295696d1297887
          path: dsh-core-016-alpha2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the planned revision and declared version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${{ needs.plan.outputs.tag }}" = "v$version"
          test "${{ needs.plan.outputs.sha }}" = "$(git rev-parse HEAD)"
      - name: Verify exact rc.1 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-rc1
      - name: Verify exact alpha.1 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-alpha1
      - name: Verify exact 0.1.5-alpha.1 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-015-alpha1
      - name: Verify exact 0.1.5-alpha.2 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-015-alpha2
      - name: Verify exact 0.1.5-rc.1 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-015-rc1
      - name: Verify exact 0.1.5-rc.2 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-015-rc2
      - name: Verify exact 0.1.6-alpha.1 source seam
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-016-alpha1
      - name: Verify exact 0.1.6-alpha.2 source seam and official-first decisions
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core-016-alpha2
      - name: Verify DSH 0.1.6 MCP v2 behavior
        shell: bash
        run: |
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 install --frozen-lockfile --ignore-scripts --filter '@deepseek-ai/dsh-mcp-client...' --filter '@deepseek-ai/dsh-mcp-resources...' --filter '@deepseek-ai/dsh-typert-generator...' --filter '@deepseek-ai/dsh-session-snapshot...' --filter '@deepseek-ai/dsh...'
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 run build:native-system
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 exec tsc -b packages/typert/generator/tsconfig.json packages/llm/llm/tsconfig.json packages/interaction/permission-presets/tsconfig.json packages/interaction/commands/tsconfig.json packages/feedback/command-feedback/tsconfig.json packages/goal/goal/tsconfig.json packages/subagent/subagent/tsconfig.json
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 exec tsdown --env.DSH_BUILD_FACE host --filter '@deepseek-ai/dsh-llm' --filter '@deepseek-ai/dsh-permission-presets' --filter '@deepseek-ai/dsh-commands' --filter '@deepseek-ai/dsh-command-feedback' --filter '@deepseek-ai/dsh-goal' --filter '@deepseek-ai/dsh-subagent'
          for path in \
            packages/llm/llm/lib/typert.host.js \
            packages/interaction/permission-presets/lib/typert.host.js \
            packages/interaction/commands/lib/typert.host.js \
            packages/feedback/command-feedback/lib/typert.host.js \
            packages/goal/goal/lib/typert.host.js \
            packages/subagent/subagent/lib/typert.host.js
          do
            test -f "dsh-core-016-alpha1/$path"
          done
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 exec vitest run packages/mcp/mcp-client/tests/apply.spec.ts packages/mcp/mcp-client/tests/protocol.spec.ts packages/mcp/mcp-client/tests/negotiation-lifecycle.spec.ts packages/mcp/mcp-client/tests/reconnect.spec.ts packages/mcp/mcp-client/tests/server-context.spec.ts packages/mcp/mcp-client/tests/tool-definition.spec.ts packages/mcp/mcp-resources/tests/resources.spec.ts apps/cli/tests/profile-mcp.spec.ts
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 exec vitest run --config vitest.expected.config.ts apps/cli/tests/profiles/headless/tests/mcp-pagination.expected.e2e.ts
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha1 exec vitest run --config vitest.snapshot.config.ts snapshots/session/headless.snapshot.ts -t 'mcp-resources'
      - name: Verify exact alpha2 MCP, Browser Use and resource behavior before packing
        shell: bash
        run: |
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 install --frozen-lockfile --ignore-scripts --filter '@deepseek-ai/dsh-mcp-client...' --filter '@deepseek-ai/dsh-mcp-resources...' --filter '@deepseek-ai/dsh-typert-generator...' --filter '@deepseek-ai/dsh-session-snapshot...' --filter '@deepseek-ai/dsh...' --filter '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp...' --filter '@deepseek-ai/dsh-experimental-browser-use-runtime...' --filter '@deepseek-ai/dsh-browser-use...'
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 run build:native-system
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 exec tsc -b packages/typert/generator/tsconfig.json packages/llm/llm/tsconfig.json packages/interaction/permission-presets/tsconfig.json packages/interaction/commands/tsconfig.json packages/feedback/command-feedback/tsconfig.json packages/goal/goal/tsconfig.json packages/subagent/subagent/tsconfig.json
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 exec tsdown --env.DSH_BUILD_FACE host --filter '@deepseek-ai/dsh-llm' --filter '@deepseek-ai/dsh-permission-presets' --filter '@deepseek-ai/dsh-commands' --filter '@deepseek-ai/dsh-command-feedback' --filter '@deepseek-ai/dsh-goal' --filter '@deepseek-ai/dsh-subagent'
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 exec vitest run packages/mcp/mcp-client/tests packages/mcp/mcp-resources/tests apps/cli/tests/profile-mcp.spec.ts packages/experimental/browser-use-playwright-mcp/tests/provider.spec.ts packages/experimental/browser-use-runtime/tests packages/browser-use/browser-use/tests/registry.spec.ts
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 exec vitest run --config vitest.expected.config.ts apps/cli/tests/profiles/headless/tests/mcp-pagination.expected.e2e.ts
          npx --yes pnpm@11.7.0 --dir dsh-core-016-alpha2 exec vitest run --config vitest.snapshot.config.ts snapshots/session/headless.snapshot.ts -t 'mcp-resources'
      - run: mkdir artifacts
      - run: npm pack --pack-destination artifacts
      - name: Write and verify SHA-256 manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum -- *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create the annotated tag on the verified revision
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          git push origin "refs/tags/$tag"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          gh release create "$tag" artifacts/*.tgz artifacts/SHA256SUMS \
            --verify-tag --draft \
            --title "dsh-playwright-host ${tag#v}" \
            --generate-notes
          mkdir downloaded-release
          gh release download "$tag" --dir downloaded-release --pattern '*.tgz' --pattern SHA256SUMS
          cmp artifacts/SHA256SUMS downloaded-release/SHA256SUMS
          (cd downloaded-release && sha256sum --check SHA256SUMS)
          gh release edit "$tag" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.immutable')" = true
