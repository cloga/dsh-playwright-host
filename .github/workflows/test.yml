name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    name: certify (${{ matrix.os }}, DSH ${{ matrix.dsh.version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        dsh:
          - version: 0.1.2-rc.1
            commit: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          - version: 0.1.3-alpha.1
            commit: d347e703908d0406b7a7ef80e3a0e594d86b2215
          - version: 0.1.5-alpha.1
            commit: 5dda764ed3aa172535a7967b06ff95d9cbfe536a
          - version: 0.1.5-alpha.2
            commit: b2e3b2a0125854567a4a5fcba75782e42fe84901
          - version: 0.1.5-rc.1
            commit: 183f08e9c6dde7e36cd2318eaee70b0da08fb35e
          - version: 0.1.5-rc.2
            commit: fb2c4b9e698e30edb738bca4cf0618587db7d203
          - version: 0.1.6-alpha.1
            commit: 0a15e36e7f82b6ed45af6fa9759f29b40dcd965d
          - version: 0.1.6-alpha.2
            commit: ddefc45fbc7f8e46dd73185e68295696d1297887
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh.commit }}
          path: dsh-core
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify static bundle and exact DSH source seams
        run: npm test
        env:
          DSH_CORE_PATH: ${{ github.workspace }}/dsh-core
      - name: Verify pinned Playwright MCP command on Windows
        if: runner.os == 'Windows'
        run: npx -y @playwright/mcp@0.0.80 --version

  contract:
    name: DSH 0.1.6 MCP v2 contract (Windows, ${{ matrix.dsh.version }})
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - version: 0.1.6-alpha.1
            commit: 0a15e36e7f82b6ed45af6fa9759f29b40dcd965d
          - version: 0.1.6-alpha.2
            commit: ddefc45fbc7f8e46dd73185e68295696d1297887
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh.commit }}
          path: dsh-core-contract
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the exact upstream MCP and CLI test closure
        shell: pwsh
        run: |
          npx --yes pnpm@11.7.0 --dir dsh-core-contract install --frozen-lockfile --ignore-scripts --filter '@deepseek-ai/dsh-mcp-client...' --filter '@deepseek-ai/dsh-mcp-resources...' --filter '@deepseek-ai/dsh-typert-generator...' --filter '@deepseek-ai/dsh...'
      - name: Build the exact upstream headless Typert contributors
        shell: pwsh
        run: |
          npx --yes pnpm@11.7.0 --dir dsh-core-contract exec tsc -b packages/typert/generator/tsconfig.json packages/llm/llm/tsconfig.json packages/interaction/permission-presets/tsconfig.json packages/interaction/commands/tsconfig.json packages/feedback/command-feedback/tsconfig.json packages/goal/goal/tsconfig.json packages/subagent/subagent/tsconfig.json
          npx --yes pnpm@11.7.0 --dir dsh-core-contract exec tsdown --env.DSH_BUILD_FACE host --filter '@deepseek-ai/dsh-llm' --filter '@deepseek-ai/dsh-permission-presets' --filter '@deepseek-ai/dsh-commands' --filter '@deepseek-ai/dsh-command-feedback' --filter '@deepseek-ai/dsh-goal' --filter '@deepseek-ai/dsh-subagent'
          foreach ($path in @(
            'packages/llm/llm/lib/typert.host.js',
            'packages/interaction/permission-presets/lib/typert.host.js',
            'packages/interaction/commands/lib/typert.host.js',
            'packages/feedback/command-feedback/lib/typert.host.js',
            'packages/goal/goal/lib/typert.host.js',
            'packages/subagent/subagent/lib/typert.host.js'
          )) {
            if (!(Test-Path (Join-Path 'dsh-core-contract' $path))) {
              throw "Missing required Typert contributor: $path"
            }
          }
      - name: Verify MCP SDK v2 initialization, tools, resources, cancellation, recovery, and cleanup
        shell: pwsh
        run: |
          npx --yes pnpm@11.7.0 --dir dsh-core-contract exec vitest run packages/mcp/mcp-client/tests/apply.spec.ts packages/mcp/mcp-client/tests/protocol.spec.ts packages/mcp/mcp-client/tests/negotiation-lifecycle.spec.ts packages/mcp/mcp-client/tests/reconnect.spec.ts packages/mcp/mcp-client/tests/server-context.spec.ts packages/mcp/mcp-client/tests/tool-definition.spec.ts packages/mcp/mcp-resources/tests/resources.spec.ts apps/cli/tests/profile-mcp.spec.ts
      - name: Verify SDK pagination failure is isolated from the headless Host route
        shell: pwsh
        run: npx --yes pnpm@11.7.0 --dir dsh-core-contract exec vitest run --config vitest.expected.config.ts apps/cli/tests/profiles/headless/tests/mcp-pagination.expected.e2e.ts
  resource-snapshot:
    name: DSH 0.1.6 MCP resource snapshot (Ubuntu) ${{ matrix.dsh.version }}
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - version: 0.1.6-alpha.1
            commit: 0a15e36e7f82b6ed45af6fa9759f29b40dcd965d
          - version: 0.1.6-alpha.2
            commit: ddefc45fbc7f8e46dd73185e68295696d1297887
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh.commit }}
          path: dsh-core-resources
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the exact upstream resource snapshot closure
        run: npx --yes pnpm@11.7.0 --dir dsh-core-resources install --frozen-lockfile --ignore-scripts --filter '@deepseek-ai/dsh-mcp-client...' --filter '@deepseek-ai/dsh-mcp-resources...' --filter '@deepseek-ai/dsh-typert-generator...' --filter '@deepseek-ai/dsh-session-snapshot...' --filter '@deepseek-ai/dsh...'
      - name: Build the exact upstream headless Typert contributors
        run: |
          npx --yes pnpm@11.7.0 --dir dsh-core-resources run build:native-system
          npx --yes pnpm@11.7.0 --dir dsh-core-resources exec tsc -b packages/typert/generator/tsconfig.json packages/llm/llm/tsconfig.json packages/interaction/permission-presets/tsconfig.json packages/interaction/commands/tsconfig.json packages/feedback/command-feedback/tsconfig.json packages/goal/goal/tsconfig.json packages/subagent/subagent/tsconfig.json
          npx --yes pnpm@11.7.0 --dir dsh-core-resources exec tsdown --env.DSH_BUILD_FACE host --filter '@deepseek-ai/dsh-llm' --filter '@deepseek-ai/dsh-permission-presets' --filter '@deepseek-ai/dsh-commands' --filter '@deepseek-ai/dsh-command-feedback' --filter '@deepseek-ai/dsh-goal' --filter '@deepseek-ai/dsh-subagent'
      - name: Verify resource discovery, reads, URI templates, and native/PTC projections
        run: npx --yes pnpm@11.7.0 --dir dsh-core-resources exec vitest run --config vitest.snapshot.config.ts snapshots/session/headless.snapshot.ts -t 'mcp-resources'

  official-browser-contract:
    name: Official alpha2 Browser Use contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ddefc45fbc7f8e46dd73185e68295696d1297887
          path: dsh-core-browser
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact official Browser Use test closure
        run: npx --yes pnpm@11.7.0 --dir dsh-core-browser install --frozen-lockfile --ignore-scripts --filter '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp...' --filter '@deepseek-ai/dsh-experimental-browser-use-runtime...' --filter '@deepseek-ai/dsh-browser-use...'
      - name: Verify official provider, Agent isolation, cancellation and teardown
        run: npx --yes pnpm@11.7.0 --dir dsh-core-browser exec vitest run packages/experimental/browser-use-playwright-mcp/tests/provider.spec.ts packages/experimental/browser-use-runtime/tests/mcp.spec.ts packages/experimental/browser-use-runtime/tests/resources.spec.ts packages/experimental/browser-use-runtime/tests/agent-disposal.spec.ts packages/browser-use/browser-use/tests/registry.spec.ts

  browser:
    name: Pinned MCP real Edge capability parity (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned MCP into isolated runner scratch
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/playwright-smoke" --ignore-scripts --no-audit --no-fund @playwright/mcp@0.0.80
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained caps and official defaults with real isolated Edge
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_MCP_CLI = "$env:RUNNER_TEMP/playwright-smoke/node_modules/@playwright/mcp/cli.js"
          $env:DSH_BROWSER_EXECUTABLE = "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe"
          if (!(Test-Path $env:DSH_BROWSER_EXECUTABLE)) { throw 'Installed Edge is required for browser qualification' }
          $env:REQUIRE_BROWSER_TEST = '1'
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release-ready:
    name: release-ready
    needs: [certify, contract, resource-snapshot, official-browser-contract, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the full certification matrix
        shell: bash
        env:
          CERTIFY_RESULT: ${{ needs.certify.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          RESOURCE_SNAPSHOT_RESULT: ${{ needs.resource-snapshot.result }}
          OFFICIAL_BROWSER_RESULT: ${{ needs.official-browser-contract.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CERTIFY_RESULT" = success
          test "$CONTRACT_RESULT" = success
          test "$RESOURCE_SNAPSHOT_RESULT" = success
          test "$OFFICIAL_BROWSER_RESULT" = success
          test "$BROWSER_RESULT" = success

  release:
    name: release
    needs: [release-ready]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-ready.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
